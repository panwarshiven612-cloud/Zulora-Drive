<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zulora Drive — Sign In & Authentication</title>
  <!-- Preconnect and DNS-Prefetch Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://i.postimg.cc" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://i.postimg.cc">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Non-blocking Preloaded Google Fonts with font-display: swap -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  </noscript>

  <!-- Non-blocking Preloaded Font Awesome Icons -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </noscript>
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card" id="authCard">
      <!-- BRAND HEADER -->
      <div class="auth-brand">
        <div class="auth-logo-wrapper">
          <img src="https://i.postimg.cc/VL9RBtWh/Elegant-AI-Agency-Logo-for-Zulora-20260208-153446-0000.png" alt="Zulora Drive Logo" class="auth-logo-img" width="56" height="56" fetchpriority="high" decoding="async">
        </div>
        <h1 class="auth-title">Zulora Drive</h1>
        <p class="auth-subtitle">Next-Gen Cloud Storage & Fast Sync</p>
      </div>

      <!-- AUTH TABS -->
      <div class="auth-tabs">
        <button id="tabSignIn" class="auth-tab active" type="button">Sign In</button>
        <button id="tabSignUp" class="auth-tab" type="button">Sign Up</button>
      </div>

      <!-- ERROR / ALERT BANNER -->
      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <!-- GOOGLE SIGN-IN BUTTON -->
      <button id="googleSignInBtn" class="btn btn-google-auth" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.8.54-1.83.86-3.12.86-2.4 0-4.43-1.62-5.16-3.8l-2.9 2.24C2.43 15.72 5.46 18 9 18z"/>
          <path fill="#FBBC05" d="M3.84 10.68c-.19-.54-.3-1.12-.3-1.68s.11-1.14.3-1.68L.94 5.08C.34 6.26 0 7.59 0 9s.34 2.74.94 3.92l2.9-2.24z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.46 0 2.43 2.28.94 5.08l2.9 2.24c.73-2.18 2.76-3.74 5.16-3.74z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span>OR EMAIL</span>
      </div>

      <!-- FORM -->
      <form id="authForm" autocomplete="on">
        <div id="nameGroup" class="form-group" style="display: none;">
          <label for="authName" class="form-label">Full Name</label>
          <input type="text" id="authName" placeholder="John Doe" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="authEmail" class="form-label">Email Address</label>
          <input type="email" id="authEmail" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="authPassword" class="form-label">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div id="forgotRow" class="form-subrow">
          <a href="#" id="forgotPasswordBtn" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn btn-azure-gradient btn-full">
          <span>Sign In</span>
        </button>
      </form>

      <!-- FOOTER TOGGLE -->
      <div class="auth-footer">
        <span id="authFooterText">Don't have an account?</span>
        <a href="#" id="toggleAuthModeBtn" class="auth-link">Sign up free</a>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      signInWithGoogle,
      signInWithEmail,
      registerWithEmail,
      resendVerificationEmail,
      resetPassword,
      onAuthChange,
      friendlyAuthError,
      isDisposableEmail
    } from './auth.js';

    import { auth } from './firebase-config.js';

    let isSignUp = false;

    // ── Track pending-verification state ──────────────────────────────────────
    let pendingEmail    = null;
    let pendingPassword = null; // Held in memory only — never persisted

    // ── Redirect on auth state change (verified users only) ───────────────────
    onAuthChange((user) => {
      // Google users are always verified; email users must pass emailVerified check
      if (user && user.emailVerified) {
        window.location.replace('index.html');
      }
      // If signed in but unverified, sign them out silently to keep the page clean
      // (the pending screen already handles their state)
      if (user && !user.emailVerified) {
        import('./firebase-config.js').then(({ signOut, auth }) => signOut(auth).catch(() => {}));
      }
    });

    // ── Handle ?verified=1 redirect from the verification email link ──────────
    if (new URLSearchParams(window.location.search).get('verified') === '1') {
      showAlert(
        '✅ Email verified! Please sign in with your credentials below.',
        'success'
      );
    }

    const tabSignIn         = document.getElementById('tabSignIn');
    const tabSignUp         = document.getElementById('tabSignUp');
    const nameGroup         = document.getElementById('nameGroup');
    const authForm          = document.getElementById('authForm');
    const authSubmitBtn     = document.getElementById('authSubmitBtn');
    const authAlert         = document.getElementById('authAlert');
    const googleSignInBtn   = document.getElementById('googleSignInBtn');
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    const forgotRow         = document.getElementById('forgotRow');
    const toggleAuthModeBtn = document.getElementById('toggleAuthModeBtn');
    const authFooterText    = document.getElementById('authFooterText');
    const authCard          = document.getElementById('authCard');

    function setAuthMode(signUp) {
      isSignUp = signUp;
      authAlert.style.display = 'none';
      hideVerifyPendingScreen();

      if (isSignUp) {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        nameGroup.style.display = 'block';
        forgotRow.style.display = 'none';
        authSubmitBtn.querySelector('span').textContent = 'Create Account';
        authFooterText.textContent = 'Already have an account?';
        toggleAuthModeBtn.textContent = 'Sign in';
      } else {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        nameGroup.style.display = 'none';
        forgotRow.style.display = 'block';
        authSubmitBtn.querySelector('span').textContent = 'Sign In';
        authFooterText.textContent = "Don't have an account?";
        toggleAuthModeBtn.textContent = 'Sign up free';
      }
    }

    tabSignIn.addEventListener('click', () => setAuthMode(false));
    tabSignUp.addEventListener('click', () => setAuthMode(true));
    toggleAuthModeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      setAuthMode(!isSignUp);
    });

    function showAlert(message, type = 'danger') {
      authAlert.className = `auth-alert ${type}`;
      authAlert.innerHTML = message;
      authAlert.style.display = 'block';
    }

    // ── Verification Pending Screen ───────────────────────────────────────────
    function showVerifyPendingScreen(email) {
      const existing = document.getElementById('verifyPendingScreen');
      if (existing) existing.remove();

      const screen = document.createElement('div');
      screen.id = 'verifyPendingScreen';
      screen.className = 'verify-pending-screen';
      screen.innerHTML = `
        <div class="verify-pending-icon">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h2 class="verify-pending-title">Verify Your Email</h2>
        <p class="verify-pending-body">
          We've sent a verification link to<br>
          <strong class="verify-pending-email">${escHtml(email)}</strong><br>
          Check your inbox (and spam folder) then click the link to activate your Zulora Drive account.
        </p>
        <div class="verify-pending-steps">
          <div class="verify-step">
            <span class="verify-step-num">1</span>
            <span>Open Gmail / your inbox</span>
          </div>
          <div class="verify-step">
            <span class="verify-step-num">2</span>
            <span>Find the email from Zulora Drive</span>
          </div>
          <div class="verify-step">
            <span class="verify-step-num">3</span>
            <span>Click "Verify your email" in the email</span>
          </div>
        </div>
        <div class="verify-pending-actions">
          <button id="resendVerifyBtn" class="btn btn-azure-gradient btn-full">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Resend Verification Email</span>
          </button>
          <button id="backToSignInBtn" class="btn btn-secondary btn-full" style="margin-top:0.5rem;">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Sign In</span>
          </button>
        </div>
        <p id="verifyPendingStatus" class="verify-pending-status" style="display:none;"></p>
      `;

      // Hide the regular auth form content
      authForm.style.display = 'none';
      if (googleSignInBtn) googleSignInBtn.style.display = 'none';
      document.querySelector('.auth-divider')?.style.setProperty('display', 'none');
      document.querySelector('.auth-tabs')?.style.setProperty('display', 'none');
      document.querySelector('.auth-footer')?.style.setProperty('display', 'none');
      authAlert.style.display = 'none';

      authCard.appendChild(screen);

      // ── Resend Button ──────────────────────────────────────────────────────
      document.getElementById('resendVerifyBtn').addEventListener('click', async () => {
        const resendBtn   = document.getElementById('resendVerifyBtn');
        const statusEl    = document.getElementById('verifyPendingStatus');

        if (!pendingPassword) {
          statusEl.className = 'verify-pending-status error';
          statusEl.textContent = 'Session expired. Please sign up again to resend.';
          statusEl.style.display = 'block';
          return;
        }

        resendBtn.disabled = true;
        resendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        statusEl.style.display = 'none';

        try {
          const result = await resendVerificationEmail(email, pendingPassword);
          if (result.alreadyVerified) {
            statusEl.className = 'verify-pending-status success';
            statusEl.textContent = '✅ Your email is already verified! Please sign in.';
            statusEl.style.display = 'block';
            setTimeout(() => setAuthMode(false), 2500);
          } else {
            statusEl.className = 'verify-pending-status success';
            statusEl.textContent = '✅ Verification email resent! Please check your inbox.';
            statusEl.style.display = 'block';
          }
        } catch (err) {
          statusEl.className = 'verify-pending-status error';
          statusEl.textContent = '⚠️ ' + (err.message || 'Failed to resend. Please try again.');
          statusEl.style.display = 'block';
        } finally {
          resendBtn.disabled = false;
          resendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Resend Verification Email</span>';
          // Rate-limit button — 30 second cooldown
          resendBtn.disabled = true;
          let cooldown = 30;
          const interval = setInterval(() => {
            cooldown--;
            resendBtn.innerHTML = `<i class="fa-solid fa-clock"></i> <span>Resend available in ${cooldown}s</span>`;
            if (cooldown <= 0) {
              clearInterval(interval);
              resendBtn.disabled = false;
              resendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Resend Verification Email</span>';
            }
          }, 1000);
        }
      });

      // ── Back to Sign In ────────────────────────────────────────────────────
      document.getElementById('backToSignInBtn').addEventListener('click', () => {
        pendingEmail    = null;
        pendingPassword = null;
        setAuthMode(false);
      });
    }

    function hideVerifyPendingScreen() {
      const screen = document.getElementById('verifyPendingScreen');
      if (screen) screen.remove();
      authForm.style.display = '';
      if (googleSignInBtn) googleSignInBtn.style.display = '';
      document.querySelector('.auth-divider')?.style.removeProperty('display');
      document.querySelector('.auth-tabs')?.style.removeProperty('display');
      document.querySelector('.auth-footer')?.style.removeProperty('display');
    }

    function escHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Google Auth ───────────────────────────────────────────────────────────
    googleSignInBtn.addEventListener('click', async () => {
      authAlert.style.display = 'none';
      try {
        await signInWithGoogle();
        // Redirect handled by onAuthChange (Google users are always verified)
      } catch (err) {
        showAlert(friendlyAuthError(err));
      }
    });

    // ── Form Submit (Email / Password) ────────────────────────────────────────
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authAlert.style.display = 'none';

      const email    = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        return showAlert('Please fill out all required fields.');
      }

      // ── Client-side disposable email gate (Sign-Up only) ──────────────────
      if (isSignUp && isDisposableEmail(email)) {
        return showAlert(
          '🚫 <strong>Temporary or disposable email addresses are strictly prohibited.</strong> ' +
          'Please use a valid personal or work email, or sign in with Google.'
        );
      }

      authSubmitBtn.disabled = true;
      authSubmitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';

      try {
        if (isSignUp) {
          // Secure registration — returns { verificationSent: true, email }
          const result = await registerWithEmail(email, password);
          if (result && result.verificationSent) {
            // Hold password in session memory for resend functionality
            pendingEmail    = email;
            pendingPassword = password;
            showVerifyPendingScreen(email);
          }
        } else {
          await signInWithEmail(email, password);
          // Redirect handled by onAuthChange for verified users
        }
      } catch (err) {
        // Show specific message for disposable email errors
        if (err.code === 'DISPOSABLE_EMAIL') {
          showAlert(
            '🚫 <strong>Temporary or disposable email addresses are strictly prohibited.</strong> ' +
            'Please use a valid personal or work email, or sign in with Google.'
          );
        } else {
          showAlert(friendlyAuthError(err));
        }
        authSubmitBtn.disabled = false;
        const spanEl = authSubmitBtn.querySelector('span');
        if (spanEl) spanEl.textContent = isSignUp ? 'Create Account' : 'Sign In';
        else authSubmitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
      }
    });

    // ── Password Reset ────────────────────────────────────────────────────────
    forgotPasswordBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      authAlert.style.display = 'none';
      const email = document.getElementById('authEmail').value.trim();

      if (!email) {
        return showAlert('Please enter your email address above to reset password.', 'warning');
      }

      try {
        await resetPassword(email);
        showAlert(`Password reset email sent to ${escHtml(email)}. Please check your inbox.`, 'success');
      } catch (err) {
        showAlert(friendlyAuthError(err));
      }
    });
  </script>
</body>
</html>
