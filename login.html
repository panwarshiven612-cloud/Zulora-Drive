<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in securely to Zulora Drive — Private Enterprise Cloud Storage.">
  <title>Sign in · Zulora Drive</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <!-- Pearl & Azure Theme Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card glass" aria-labelledby="auth-title">
    <!-- Brand Header -->
    <div class="auth-header">
      <img class="auth-logo" src="https://i.postimg.cc/VL9RBtWh/Elegant-AI-Agency-Logo-for-Zulora-20260208-153446-0000.png" alt="Zulora Drive Logo">
      <h1 id="auth-title">Zulora Drive</h1>
      <p id="auth-subtitle">Sign in to access your cloud files and storage.</p>
    </div>

    <!-- Alert / Status Notification -->
    <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

    <!-- Google One-Click Sign In -->
    <button id="googleSignInBtn" class="btn-google" type="button">
      <i class="fa-brands fa-google" style="color: #ea4335;"></i>
      <span>Continue with Google</span>
    </button>

    <!-- Divider -->
    <div class="auth-divider">
      <span>or continue with email</span>
    </div>

    <!-- Auth Mode Switcher (Sign in vs Register) -->
    <div class="auth-tabs" role="tablist">
      <button id="tabSignIn" class="auth-tab active" type="button" role="tab" aria-selected="true">Sign In</button>
      <button id="tabRegister" class="auth-tab" type="button" role="tab" aria-selected="false">Create Account</button>
    </div>

    <!-- Email & Password Form -->
    <form id="authForm" class="auth-form" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="displayName">Full Name</label>
        <input id="displayName" class="form-input" type="text" placeholder="John Doe" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="authEmail">Email Address</label>
        <input id="authEmail" class="form-input" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="authPassword">Password</label>
          <a id="forgotPasswordBtn" href="#" style="font-size: 0.78rem; color: var(--azure-primary); font-weight: 500;">Forgot?</a>
        </div>
        <input id="authPassword" class="form-input" type="password" placeholder="••••••••" minlength="6" required autocomplete="current-password">
      </div>

      <button id="submitBtn" class="btn btn-primary" type="submit" style="width: 100%; height: 42px; margin-top: 4px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span id="submitBtnText">Sign In to Zulora Drive</span>
      </button>
    </form>

    <!-- Features & Direct Support Note -->
    <div style="margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--azure-primary); font-weight: 600;">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>10 GB Free Storage Automatically Included</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 4px; flex-wrap: wrap;">
        <a href="tel:+916395211325" style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;">
          <i class="fa-solid fa-phone" style="color: var(--azure-primary);"></i> +91 6395211325
        </a>
        <a href="https://wa.me/916395211325?text=Hi%20Zulora%20Drive%20Support" target="_blank" rel="noopener noreferrer" style="color: #15803d; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Help
        </a>
        <a href="mailto:zulora.help@gmail.com" style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;">
          <i class="fa-solid fa-envelope"></i> zulora.help@gmail.com
        </a>
      </div>
    </div>
  </main>

  <!-- Login Page Logic Module -->
  <script type="module">
    import {
      signInWithGoogle,
      signInWithEmail,
      registerWithEmail,
      resetPassword,
      onAuthChange,
      bootstrapUser,
      friendlyAuthError
    } from './auth.js';

    const tabSignIn = document.getElementById('tabSignIn');
    const tabRegister = document.getElementById('tabRegister');
    const nameGroup = document.getElementById('nameGroup');
    const authForm = document.getElementById('authForm');
    const displayNameInput = document.getElementById('displayName');
    const authEmailInput = document.getElementById('authEmail');
    const authPasswordInput = document.getElementById('authPassword');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    const authAlert = document.getElementById('authAlert');

    let isRegisterMode = false;

    // Show message banner
    function showAlert(message, type = 'error') {
      authAlert.className = `auth-alert ${type}`;
      authAlert.textContent = message;
      authAlert.style.display = 'block';
    }

    function clearAlert() {
      authAlert.style.display = 'none';
      authAlert.textContent = '';
    }

    // Switch between Sign In and Register
    tabSignIn.addEventListener('click', () => {
      isRegisterMode = false;
      tabSignIn.classList.add('active');
      tabSignIn.setAttribute('aria-selected', 'true');
      tabRegister.classList.remove('active');
      tabRegister.setAttribute('aria-selected', 'false');
      nameGroup.style.display = 'none';
      submitBtnText.textContent = 'Sign In to Zulora Drive';
      clearAlert();
    });

    tabRegister.addEventListener('click', () => {
      isRegisterMode = true;
      tabRegister.classList.add('active');
      tabRegister.setAttribute('aria-selected', 'true');
      tabSignIn.classList.remove('active');
      tabSignIn.setAttribute('aria-selected', 'false');
      nameGroup.style.display = 'flex';
      submitBtnText.textContent = 'Create 10 GB Account';
      clearAlert();
    });

    // Check if user is already signed in -> redirect to main drive
    onAuthChange(async (user) => {
      if (user) {
        try {
          await bootstrapUser();
        } catch (e) {
          console.warn('[Zulora Auth] Bootstrap notice:', e);
        }
        window.location.replace('index.html');
      }
    });

    // Google Sign-In
    googleSignInBtn.addEventListener('click', async () => {
      clearAlert();
      googleSignInBtn.disabled = true;
      try {
        await signInWithGoogle();
        showAlert('Signing in with Google...', 'success');
      } catch (err) {
        showAlert(friendlyAuthError(err), 'error');
        googleSignInBtn.disabled = false;
      }
    });

    // Form Submit (Email / Password)
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;
      const displayName = displayNameInput.value.trim();

      if (!email || !password) {
        showAlert('Please provide both email and password.', 'error');
        return;
      }

      submitBtn.disabled = true;

      try {
        if (isRegisterMode) {
          submitBtnText.textContent = 'Creating account...';
          const userCredential = await registerWithEmail(email, password);
          if (displayName && userCredential.user) {
            try {
              await bootstrapUser();
            } catch (_) {}
          }
          showAlert('Account created successfully! Redirecting...', 'success');
        } else {
          submitBtnText.textContent = 'Signing in...';
          await signInWithEmail(email, password);
          showAlert('Welcome back! Redirecting...', 'success');
        }
      } catch (err) {
        showAlert(friendlyAuthError(err), 'error');
        submitBtn.disabled = false;
        submitBtnText.textContent = isRegisterMode ? 'Create 10 GB Account' : 'Sign In to Zulora Drive';
      }
    });

    // Forgot Password
    forgotPasswordBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = authEmailInput.value.trim();
      if (!email) {
        showAlert('Enter your email address above to receive a password reset link.', 'error');
        authEmailInput.focus();
        return;
      }
      try {
        await resetPassword(email);
        showAlert(`Password reset email sent to ${email}. Check your inbox!`, 'success');
      } catch (err) {
        showAlert(friendlyAuthError(err), 'error');
      }
    });
  </script>
</body>
</html>
