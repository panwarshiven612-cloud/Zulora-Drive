<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in securely to Zulora Drive.">
  <title>Sign in · Zulora Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="auth-card glass" aria-labelledby="login-title">
      <a class="brand" href="index.html" aria-label="Zulora Drive home">
        <img src="https://i.postimg.cc/VL9RBtWh/Elegant-AI-Agency-Logo-for-Zulora-20260208-153446-0000.png" alt="Zulora logo">
        <span>Zulora Drive<small>PRIVATE CLOUD STORAGE</small></span>
      </a>
      <p class="eyebrow">Secure workspace</p>
      <h1 id="login-title">Your files, always within reach.</h1>
      <p>Open your private Zulora Drive. New accounts receive 10 GB free storage automatically.</p>
      <button id="googleSignInButton" class="button google-button wide" type="button">
        <span class="google-mark" aria-hidden="true"><i class="fa-brands fa-google"></i></span>
        Continue with Google
      </button>
      <div class="auth-divider"><span>or use email</span></div>
      <div class="auth-tabs" role="tablist"><button class="auth-tab active" data-auth-mode="signin" type="button" role="tab">Sign in</button><button class="auth-tab" data-auth-mode="register" type="button" role="tab">Create account</button></div>
      <form id="emailAuthForm" class="email-auth-form"><label for="authEmail">Email address</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"><button id="emailAuthButton" class="button wide" type="submit">Sign in securely</button></form>
      <p id="authMessage" class="status-message" role="alert" aria-live="polite"></p>
      <div class="security-note">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        <span>Each request is verified with your Firebase session. Files are never made public by the drive server.</span>
      </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
